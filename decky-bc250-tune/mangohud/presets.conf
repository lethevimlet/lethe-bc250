[preset 1]
# bc250-tune managed — one line: "· 47 FPS | GPU °C MHz  CPU °C  SoC W  TOTAL ~W  FAN rpm  CU/cores"
# Rules (MangoHud 0.8, legacy_layout=0): every listed option becomes a "|" column, even x=0 ones,
# so only fps and exec are listed; fps_text replaces the engine name; frametime=0 must be LAST.
legacy_layout=0
horizontal=1
hud_compact=1
hud_no_margin=1
fps
fps_text=·
exec=/usr/local/bin/bc250-tune hud-stats
font_size=16
background_alpha=0.25
round_corners=6

frametime=0
