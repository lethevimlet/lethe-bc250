<text x="596" y="528" text-anchor="middle" fill="#5b636e" font-size="12">ESP32 G, button return, PC817 pin 2</text>
<text x="14" y="606" text-anchor="start" fill="#5b636e" font-size="12">Pad names are the ones printed on the board. They are printed on the underside, where the two columns appear mirrored: with the</text>
<text x="14" y="624" text-anchor="start" fill="#5b636e" font-size="12">components facing you and USB-C up, 5V · G · 3.3 · 4 · 3 · 2 · 1 · 0 run down the right edge and 5 · 6 · 7 · 8 · 9 · 10 · 20 · 21 down the left.</text>
<text x="14" y="642" text-anchor="start" fill="#5b636e" font-size="12">Lines that cross with a hop are not connected; a dot is a joint.</text>
